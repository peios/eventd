[package]
name = "eventd-client"
description = "A client for eventd's query channel (PSPU book 3): framing, results, live tails, query text and read access."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
libc = { workspace = true }
peios = { workspace = true }
peios-sys = { workspace = true, optional = true }

[features]
default = ["access"]
# Query-only consumers need framing and actual server-side authorization, not
# local policy previews or a direct SDK dependency for access-list construction.
access = ["dep:peios-sys"]

[lints]
workspace = true
