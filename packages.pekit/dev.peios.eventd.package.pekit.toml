# The critical daemon, its inert registry policy, and protected empty state
# skeleton. The exact evctl dependency preserves the old monolith's installed
# interface while keeping the client independently deployable.
[package]
name        = "dev.peios.eventd"
description = "Peios durable event, log, and metric service"

[provides]
eventd = "{{version}}-10"

[replaces]
eventd = "<= {{version}}-9"

[dependencies]
"dev.peios.evctl" = "= {{version}}-10"
"dev.peios.authd" = ">= 0.0.14"

[files]
"@source:LICENSE"                    = "usr/share/licenses/dev.peios.eventd/LICENSE"
":usr/sbin/eventd"                   = "usr/sbin/eventd"
":usr/share/regim/eventd-config.reg" = "usr/share/regim/eventd-config.reg"
":usr/share/regim/eventd-service.reg" = "usr/share/regim/eventd-service.reg"
":usr/share/regman/eventd.regman"    = "usr/share/regman/eventd.regman"
":var/state/eventd/events"           = "var/state/eventd/events"
":var/state/eventd/logs"             = "var/state/eventd/logs"
":var/state/eventd/metrics"          = "var/state/eventd/metrics"

[sd_overrides]
"var/state/eventd/events"  = "O:SYG:SYD:P(A;OICI;GA;;;SY)(A;OICI;GA;;;BA)"
"var/state/eventd/logs"    = "O:SYG:SYD:P(A;OICI;GA;;;SY)(A;OICI;GA;;;BA)"
"var/state/eventd/metrics" = "O:SYG:SYD:P(A;OICI;GA;;;SY)(A;OICI;GA;;;BA)"
