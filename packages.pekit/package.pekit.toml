# Shared metadata for eventd's qualified production package family. Revision
# 10 follows the nine unqualified development snapshots and introduces the
# hermetic source graph, split client/debug payloads, and production gates.

format = "peipkg"

[package]
version       = "{{version}}-10"
architecture  = "x86_64"
license       = "MIT"
license_class = "free"
homepage      = "https://github.com/peios/eventd"
