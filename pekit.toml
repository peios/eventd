# eventd — Peios's durable event, log and metric daemon.
#
# The libpeios bootstrap mirrors the other Rust platform daemons: packaged
# builds use pkg-config, while a monorepo build synthesizes peios.pc from the
# sibling libpeios and built PKM header trees when necessary.

out_dir = "out"

[build]
command = """
set -eu
set -o pipefail 2>/dev/null || true

SRC="$(pwd)"
REPO_ROOT="$(cd "$SRC/.." && pwd)"

for tool in cargo rustc gcc pkg-config; do
  command -v "$tool" >/dev/null || { echo "missing required eventd build tool: $tool" >&2; exit 1; }
done

unset PEIOS_LIB_DIR PEIOS_INCLUDE PKM_UAPI

if ! pkg-config --exists peios; then
  LIBPEIOS_ROOT="$REPO_ROOT/libpeios"
  PKM_UAPI_ROOT="$REPO_ROOT/pkm/out/build/headers/usr/include"
  [ -f "$LIBPEIOS_ROOT/Cargo.toml" ] || { echo "libpeios not found at $LIBPEIOS_ROOT" >&2; exit 1; }
  [ -d "$LIBPEIOS_ROOT/include/peios" ] || { echo "libpeios headers not found" >&2; exit 1; }
  [ -d "$PKM_UAPI_ROOT/pkm" ] || { echo "pkm UAPI headers not found at $PKM_UAPI_ROOT" >&2; exit 1; }

  cargo build --release --locked --manifest-path "$LIBPEIOS_ROOT/Cargo.toml"

  PC_DIR="$PEKIT_OUT/pkgconfig"
  mkdir -p "$PC_DIR"
  LIBPEIOS_VERSION="$(sed -n 's/^version = "\\([^"]*\\)".*/\\1/p' "$LIBPEIOS_ROOT/Cargo.toml" | head -1)"
  {
    printf 'prefix=%s\\n' "$LIBPEIOS_ROOT"
    printf 'exec_prefix=${prefix}\\n'
    printf 'libdir=%s/target/release\\n' "$LIBPEIOS_ROOT"
    printf 'includedir=%s/include\\n' "$LIBPEIOS_ROOT"
    printf '\\n'
    printf 'Name: peios\\n'
    printf 'Description: Peios userspace C ABI library (libpeios)\\n'
    printf 'Version: %s\\n' "$LIBPEIOS_VERSION"
    printf 'Libs: -L${libdir} -lpeios\\n'
    printf 'Cflags: -I${includedir} -I%s\\n' "$PKM_UAPI_ROOT"
  } > "$PC_DIR/peios.pc"
  export PKG_CONFIG_PATH="$PC_DIR${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
fi

export BINDGEN_EXTRA_CLANG_ARGS="-isystem $(gcc -print-file-name=include) ${BINDGEN_EXTRA_CLANG_ARGS:-}"

cargo build --release --locked --bin eventd --bin evctl --target-dir "$PEKIT_OUT/target"

mkdir -p "$PEKIT_OUT/usr/bin" "$PEKIT_OUT/usr/sbin" "$PEKIT_OUT/usr/share/regim" "$PEKIT_OUT/usr/share/regman"
install -m 0755 "$PEKIT_OUT/target/release/evctl" "$PEKIT_OUT/usr/bin/evctl"
install -m 0755 "$PEKIT_OUT/target/release/eventd" "$PEKIT_OUT/usr/sbin/eventd"
install -m 0644 "$SRC/registry.d/eventd-config.reg" "$PEKIT_OUT/usr/share/regim/eventd-config.reg"
install -m 0644 "$SRC/registry.d/eventd-service.reg" "$PEKIT_OUT/usr/share/regim/eventd-service.reg"
install -m 0644 "$SRC/eventd.regman" "$PEKIT_OUT/usr/share/regman/eventd.regman"

# Mutable stores are never populated by a package. These empty entries only
# provision the protected directory skeleton expected during startup.
mkdir -p "$PEKIT_OUT/var/state/eventd/events"
mkdir -p "$PEKIT_OUT/var/state/eventd/logs"
mkdir -p "$PEKIT_OUT/var/state/eventd/metrics"
"""

[build.dependencies.peipkg]
cargo = "*"
rust = "*"
gcc = "*"
pkgconf-pkg-config = "*"
libpeios-devel = "*"
kernel-headers = "*"

[test]
command = "./tools/check"

[clean]
command = "cargo clean"
