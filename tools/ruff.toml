required-version = "==0.17.0"
target-version = "py311"
line-length = 100
indent-width = 4
force-exclude = true
extend-exclude = ["vendor", "generated", "node_modules", ".venv", "build", "dist"]

[lint]
select = ["E4", "E7", "E9", "F", "I", "ANN001", "ANN002", "ANN003", "ANN201", "ANN202", "ANN204", "ANN205", "ANN206"]
# Wildcard imports are discouraged, not forbidden. Avoid turning that preference
# into a hard requirement or reporting unknowable names after a justified wildcard.
ignore = ["F403", "F405"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false
