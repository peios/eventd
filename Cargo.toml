[workspace]
resolver = "2"
members = ["eventd-core", "eventd-client", "eventd", "evctl"]

[workspace.package]
version = "0.1.11"
edition = "2024"
rust-version = "1.98.1"
license = "MIT"
publish = false

[workspace.dependencies]
crossbeam-utils = "0.8.21"
hashlink = "0.10.0"
libc = "0.2.175"
# The Peios bindings at the commit `pekit.lock` pins peios-rs's library at,
# which the rust library requires. authd takes the same commit: a program
# that links eventd-client and authd's crates, or libgxwi, can hold only
# one peios-sys, which links libpeios, so they move together.
peios = { git = "https://github.com/peios/peios-rs.git", rev = "b2282f654758831e4a2e34c7b35c26e61a6ebe1c", package = "peios" }
peios-sys = { git = "https://github.com/peios/peios-rs.git", rev = "b2282f654758831e4a2e34c7b35c26e61a6ebe1c", package = "peios-sys" }
rusqlite = { version = "0.37.0", features = ["bundled", "functions", "hooks"] }

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"

[profile.bench]
debug = true
